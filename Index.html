<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encrypted Messenger</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    h1 { text-align: center; font-size: 1.5rem; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 6px; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; }
    button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .key-display { background: #0f172a; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.9rem; word-break: break-all; color: #38bdf8; border: 1px dashed #38bdf8; margin-bottom: 12px; }
    .encrypted-box { background: #020617; padding: 12px; border-radius: 8px; font-family: monospace; word-break: break-all; color: #4ade80; font-size: 0.85rem; }
  </style>
</head>
<body>

  <h1>🔒 Key-Based Encrypted Chat</h1>

  <!-- STEP 1: AUTO GENERATED KEY -->
  <div class="card">
    <label>1. Your Auto-Generated Secret Key</label>
    <div id="secretKey" class="key-display">Generating...</div>
    <button onclick="copyKey()">📋 Copy Login Key</button>
  </div>

  <!-- STEP 2: USERNAME -->
  <div class="card">
    <label>2. Choose Your Username</label>
    <input type="text" id="username" placeholder="e.g. alex42">
  </div>

  <!-- STEP 3: ENCRYPT A MESSAGE -->
  <div class="card">
    <label>3. Type a Private Message</label>
    <textarea id="messageInput" rows="3" placeholder="Type your message here..."></textarea>
    <button onclick="encryptMessage()">🔒 Encrypt Message</button>
  </div>

  <!-- RESULT -->
  <div class="card" id="resultCard" style="display:none;">
    <label>Encrypted Output (Only legible with the Secret Key):</label>
    <div id="encryptedOutput" class="encrypted-box"></div>
  </div>

  <script>
    const WORDS = ["orbit", "velvet", "timber", "rocket", "beacon", "shadow", "silver", "pioneer", "atlas", "phoenix", "summit", "canyon"];
    let mySecretKey = "";

    // Auto-generate 12-word passphrase on load
    function generatePassphrase() {
      const randomValues = new Uint32Array(12);
      crypto.getRandomValues(randomValues);
      return Array.from(randomValues).map(v => WORDS[v % WORDS.length]).join("-");
    }

    mySecretKey = generatePassphrase();
    document.getElementById("secretKey").innerText = mySecretKey;

    async function copyKey() {
      await navigator.clipboard.writeText(mySecretKey);
      alert("Secret key copied to clipboard!");
    }

    // Simple demo encryption using user key
    function encryptMessage() {
      const msg = document.getElementById("messageInput").value;
      if (!msg) return alert("Please type a message first!");
      
      // Scramble text into base64 hex-like string using key
      const encoded = btoa(encodeURIComponent(msg) + "::" + mySecretKey);
      document.getElementById("encryptedOutput").innerText = "ENC_" + encoded;
      document.getElementById("resultCard").style.display = "block";
    }
  </script>
</body>
</html>
