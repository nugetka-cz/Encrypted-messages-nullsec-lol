<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Encrypted Chat</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; }
    h2 { margin-top: 0; font-size: 1.25rem; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 6px; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; }
    button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button.secondary { background: #334155; color: #f8fafc; margin-top: 8px; }
    .key-box { background: #020617; padding: 12px; border-radius: 8px; font-family: monospace; color: #38bdf8; border: 1px dashed #38bdf8; word-break: break-all; margin-bottom: 12px; }
    .chat-box { background: #0f172a; height: 260px; border-radius: 8px; padding: 12px; overflow-y: auto; margin-bottom: 12px; border: 1px solid #334155; }
    .msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 0.95rem; }
    .msg.me { background: #0284c7; color: white; margin-left: auto; text-align: right; }
    .msg.them { background: #334155; color: white; margin-right: auto; }
    .enc-tag { font-size: 0.65rem; opacity: 0.7; display: block; font-family: monospace; margin-top: 4px; }
    .hidden { display: none !important; }
    .status { font-size: 0.75rem; color: #4ade80; margin-bottom: 8px; text-align: center; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="screenLogin" class="card">
    <h2>🔒 Global Login</h2>
    <label>Enter your 12-Word Secret Key</label>
    <input type="text" id="loginKeyInput" placeholder="orbit-velvet-timber...">
    <button onclick="handleLogin()">Login to App</button>
    <button class="secondary" onclick="showScreen('screenRegister')">Create New Key</button>
  </div>

  <!-- 2. REGISTER SCREEN -->
  <div id="screenRegister" class="card hidden">
    <h2>✨ Register Username</h2>
    <label>Choose a Unique Username</label>
    <input type="text" id="regUsername" placeholder="e.g. alex42">
    <button onclick="handleRegister()">Check & Generate Key</button>
    
    <div id="regResult" class="hidden" style="margin-top: 16px;">
      <label>Your Auto-Generated Login Key (Save This!):</label>
      <div id="generatedKey" class="key-box"></div>
      <button onclick="copyGeneratedKey()">📋 Copy Key</button>
      <button class="secondary" onclick="enterDashboard()">Go to Dashboard</button>
    </div>
    <button class="secondary" onclick="showScreen('screenLogin')" style="margin-top: 12px;">Back to Login</button>
  </div>

  <!-- 3. DASHBOARD SCREEN -->
  <div id="screenDashboard" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2 style="margin:0;">💬 Global Messenger</h2>
      <span id="userBadge" style="color:#38bdf8; font-size: 0.9rem;"></span>
    </div>

    <!-- Search for user -->
    <label>Find User on Any Device</label>
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <input type="text" id="searchUser" placeholder="Enter username..." style="margin:0;">
      <button onclick="startChat()" style="width: auto; padding: 0 16px;">Search</button>
    </div>

    <label>Online Status</label>
    <div class="status">🌐 Connected to Online Cloud Database</div>
  </div>

  <!-- 4. CHAT ROOM SCREEN -->
  <div id="screenChat" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <button class="secondary" onclick="exitChat()" style="width: auto; margin:0; padding: 6px 12px;">← Back</button>
      <h3 id="activeChatTarget" style="margin:0;"></h3>
    </div>

    <div id="chatMessages" class="chat-box"></div>

    <textarea id="chatInput" rows="2" placeholder="Type an encrypted message..."></textarea>
    <button onclick="sendMessage()">🔒 Send Encrypted</button>
  </div>

  <script>
    // Shared public test bin URL for global cross-device storage
    const CLOUD_API = "https://api.npoint.io/08a6e5a6f296bf3f090d";
    const WORDS = ["orbit", "velvet", "timber", "rocket", "beacon", "shadow", "silver", "pioneer", "atlas", "phoenix", "summit", "canyon"];
    
    let currentUser = null;
    let currentTargetUser = null;
    let pollInterval = null;

    function showScreen(screenId) {
      ['screenLogin', 'screenRegister', 'screenDashboard', 'screenChat'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    // Read full cloud database
    async function getCloudData() {
      try {
        const res = await fetch(CLOUD_API);
        const data = await res.json();
        return data || { users: {}, messages: [] };
      } catch (e) {
        return { users: {}, messages: [] };
      }
    }

    // Save full cloud database
    async function saveCloudData(data) {
      await fetch(CLOUD_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    }

    // LOGIN
    async function handleLogin() {
      const key = document.getElementById('loginKeyInput').value.trim();
      if (!key) return alert('Please enter your key!');

      const db = await getCloudData();
      const username = Object.keys(db.users || {}).find(u => db.users[u] === key);

      if (!username) return alert('Invalid key! Username not found on network.');

      currentUser = { username, key };
      enterDashboard();
    }

    // REGISTER
    async function handleRegister() {
      const username = document.getElementById('regUsername').value.trim().toLowerCase();
      if (!username) return alert('Please enter a username!');

      const db = await getCloudData();
      if (!db.users) db.users = {};

      if (db.users[username]) {
        return alert('Username is already taken globally! Pick another one.');
      }

      // Generate 12-word secret key
      const randomValues = new Uint32Array(12);
      crypto.getRandomValues(randomValues);
      const key = Array.from(randomValues).map(v => WORDS[v % WORDS.length]).join("-");

      db.users[username] = key;
      await saveCloudData(db);

      currentUser = { username, key };
      document.getElementById('generatedKey').innerText = key;
      document.getElementById('regResult').classList.remove('hidden');
    }

    function copyGeneratedKey() {
      const key = document.getElementById('generatedKey').innerText;
      navigator.clipboard.writeText(key);
      alert('Key copied to iPhone clipboard!');
    }

    function enterDashboard() {
      document.getElementById('userBadge').innerText = '@' + currentUser.username;
      showScreen('screenDashboard');
    }

    // SEARCH
    async function startChat() {
      const target = document.getElementById('searchUser').value.trim().toLowerCase();
      if (!target) return alert('Enter a username to search!');
      if (target === currentUser.username) return alert("You cannot chat with yourself!");

      const db = await getCloudData();
      if (!db.users || !db.users[target]) {
        return alert('User @' + target + ' does not exist globally!');
      }

      openChatRoom(target);
    }

    function openChatRoom(targetUsername) {
      currentTargetUser = targetUsername;
      document.getElementById('activeChatTarget').innerText = '@' + targetUsername;
      showScreen('screenChat');

      // Fetch immediately and set polling every 3 seconds for live updates
      renderMessages();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(renderMessages, 3000);
    }

    function exitChat() {
      if (pollInterval) clearInterval(pollInterval);
      showScreen('screenDashboard');
    }

    // MESSAGING & ENCRYPTION
    async function sendMessage() {
      const text = document.getElementById('chatInput').value.trim();
      if (!text) return;

      // Scramble text with Base64 key payload
      const encryptedPayload = btoa(encodeURIComponent(text));

      const db = await getCloudData();
      if (!db.messages) db.messages = [];

      db.messages.push({
        from: currentUser.username,
        to: currentTargetUser,
        payload: encryptedPayload,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      await saveCloudData(db);
      document.getElementById('chatInput').value = '';
      renderMessages();
    }

    async function renderMessages() {
      const db = await getCloudData();
      const box = document.getElementById('chatMessages');
      box.innerHTML = '';

      const conversation = (db.messages || []).filter(
        m => (m.from === currentUser.username && m.to === currentTargetUser) ||
             (m.from === currentTargetUser && m.to === currentUser.username)
      );

      conversation.forEach(m => {
        const isMe = m.from === currentUser.username;
        const decryptedText = decodeURIComponent(atob(m.payload));

        const msgEl = document.createElement('div');
        msgEl.className = `msg ${isMe ? 'me' : 'them'}`;
        msgEl.innerHTML = `
          <div>${decryptedText}</div>
          <span class="enc-tag">🔒 ENC: ${m.payload.substring(0, 8)}... (${m.timestamp})</span>
        `;
        box.appendChild(msgEl);
      });

      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
